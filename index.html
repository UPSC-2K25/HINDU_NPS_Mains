<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Affairs Blog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="main-layout">
        <!-- Sidebar Controls & Dynamic Filters -->
        <aside class="sidebar">
            <div class="card filter-card">
                <div class="filter-group">
                    <label for="search-input">Search Keywords</label>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search topics or summary...">
                    </div>
                </div>

                <div class="filter-group">
                    <label for="month-select">Select Month</label>
                    <select id="month-select">
                        <option value="">Loading months...</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="date-input">Filter by Specific Date</label>
                    <input type="date" id="date-input">
                </div>

                <div class="filter-group">
                    <label for="gs-select">GS Paper</label>
                    <select id="gs-select">
                        <option value="all">All GS Papers</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="priority-select">Priority Level</label>
                    <select id="priority-select">
                        <option value="all">All Priorities</option>
                    </select>
                </div>

                <button id="reset-filters" class="btn btn-outline btn-full">Reset All Filters</button>
            </div>

            <div class="card stats-card">
                <div class="stat-item">
                    <span>Articles Shown</span>
                    <strong id="stat-total">0</strong>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <section class="content-area">
            <div class="view-switcher">
                <button class="tab-btn active" data-view="articles"><i class="fa-solid fa-newspaper"></i> Articles View</button>
                <button class="tab-btn" data-view="mains"><i class="fa-solid fa-pen-nib"></i> Mains Practice Questions</button>
            </div>

            <div id="articles-container" class="feed-container">
                <div class="card loading-text">Loading current affairs data...</div>
            </div>

            <div id="mains-container" class="feed-container hidden"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
