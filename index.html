<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Current Affairs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Inline Top Bar matching content width -->
        <header class="top-bar">
            <h3 class="app-title">Current Affairs</h3>
            
            <div class="view-switcher">
                <button class="tab-btn active" data-view="articles"><i class="fa-solid fa-newspaper"></i> Articles</button>
                <button class="tab-btn" data-view="mains"><i class="fa-solid fa-pen-nib"></i> Mains</button>
            </div>

            <input type="date" id="date-input" title="Select Date">

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search keywords...">
            </div>
        </header>

        <!-- GS Paper Quick Tabs -->
        <div id="gs-tabs-container" class="gs-tabs">
            <button class="gs-tab active" data-gs="all">All</button>
        </div>

        <!-- Content Area -->
        <section class="content-area">
            <div id="articles-container" class="feed-container">
                <div class="card loading-text">Select a date to load articles...</div>
            </div>

            <div id="mains-container" class="feed-container hidden"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
