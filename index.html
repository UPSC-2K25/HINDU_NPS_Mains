<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Current Affairs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="main-layout">
        <!-- Single Inline Control Bar -->
        <header class="inline-header">
            <div class="view-switcher">
                <button class="tab-btn active" data-view="articles" title="Articles View"><i class="fa-solid fa-newspaper"></i></button>
                <button class="tab-btn" data-view="mains" title="Mains Questions"><i class="fa-solid fa-pen-nib"></i></button>
            </div>

            <div class="inline-filters">
                <input type="date" id="date-input" title="Select Date">
                <input type="text" id="search-input" placeholder="Search keywords...">
            </div>

            <div id="gs-tabs-container" class="gs-tabs">
                <button class="gs-tab active" data-gs="all">All</button>
            </div>

            <div class="stat-badge">
                <strong id="stat-total">0</strong> articles
            </div>
        </header>

        <!-- Full-Width Content Area -->
        <section class="content-area">
            <div id="articles-container" class="feed-container">
                <div class="card loading-text">Select a date to load articles...</div>
            </div>

            <div id="mains-container" class="feed-container hidden"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
