<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Current Affairs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="top-bar">
            <h3 class="app-title">Current Affairs</h3>
            
            <div class="view-switcher">
                <button class="tab-btn active" data-view="articles"><i class="fa-solid fa-newspaper"></i> Articles</button>
                <button class="tab-btn" data-view="mains"><i class="fa-solid fa-pen-nib"></i> Mains</button>
            </div>

            <select id="month-select" title="Select Month">
                <option value="">Loading months...</option>
            </select>

            <input type="date" id="date-input" title="Filter by Specific Date">

            <input type="text" id="search-input" placeholder="Search keywords..." class="search-box">
        </header>

        <!-- Content Area -->
        <section class="content-area">
            <div id="articles-container" class="feed-container">
                <div class="card loading-text">Loading current affairs data...</div>
            </div>

            <div id="mains-container" class="feed-container hidden"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
