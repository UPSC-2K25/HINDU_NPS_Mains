<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Current Affairs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="main-layout">
        <!-- Top Control Bar (Full Width) -->
        <header class="top-control-bar">
            <div class="control-group">
                <label for="date-input"><i class="fa-regular fa-calendar"></i> Date</label>
                <input type="date" id="date-input">
            </div>

            <div class="control-group search-group">
                <label for="search-input"><i class="fa-solid fa-magnifying-glass"></i> Search</label>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search keywords...">
                </div>
            </div>

            <div class="control-group stats-group">
                <span>Loaded</span>
                <strong id="stat-total">0</strong>
            </div>
        </header>

        <!-- Navigation & GS Paper Pill Bar -->
        <div class="navigation-bar">
            <div class="view-switcher">
                <button class="tab-btn active" data-view="articles"><i class="fa-solid fa-newspaper"></i> Articles View</button>
                <button class="tab-btn" data-view="mains"><i class="fa-solid fa-pen-nib"></i> Mains Questions</button>
            </div>

            <div id="gs-tabs-container" class="gs-tabs">
                <button class="gs-tab active" data-gs="all">All GS Papers</button>
            </div>
        </div>

        <!-- Full-Width Content Area -->
        <section class="content-area">
            <div id="articles-container" class="feed-container">
                <div class="card loading-text">Select a date to load articles...</div>
            </div>

            <div id="mains-container" class="feed-container hidden"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
